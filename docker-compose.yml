# Production stack (Coolify's Docker Compose build pack, or any reverse proxy).
# The port is only exposed to the proxy's network, never published on the
# host, so all traffic arrives through HTTPS and X-Forwarded-For can be trusted.
#
# Running locally? Publish the port with the local override:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  openharness:
    build: .
    expose:
      - "7070"
    environment:
      OPENHARNESS_PUBLIC: "1"
      OPENHARNESS_TRUST_PROXY: "1"
    volumes:
      - openharness-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 6g

volumes:
  openharness-data:
