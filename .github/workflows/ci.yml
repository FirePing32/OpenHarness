name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race detector)
        run: go test -race -count=1 ./...

      - name: Builder UI syntax
        run: node --check web/app.js

      - name: QA scripts compile
        run: python3 -m py_compile qa/*.py qa/fixtures/*.py

      - name: QA test set is regenerated
        run: |
          python3 qa/generate.py
          git diff --exit-code -- qa/TEST_CASES.md qa/test-cases.csv \
            || { echo "::error::Run 'python3 qa/generate.py' and commit the result."; exit 1; }

  cross-compile:
    name: Cross-compile (6 targets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build builder and agent runtime for every target
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            echo "::group::$target"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o /dev/null ./cmd/harness
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o /dev/null ./cmd/openharness
            echo "::endgroup::"
          done

  e2e:
    name: End-to-end (QA fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run qa/ci_smoke.py
        run: python3 qa/ci_smoke.py
      - name: Upload agent logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/oh-smoke-*
          if-no-files-found: ignore

  docker:
    name: Docker image & exported bundles
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openharness:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the builder (public mode, as deployed)
        run: |
          docker run -d --name builder -p 7070:7070 -e OPENHARNESS_TRUST_PROXY=0 openharness:ci
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' builder)
            [ "$status" = healthy ] && break
            sleep 2
          done
          [ "$status" = healthy ] || { echo "::error::builder container is $status"; exit 1; }
          curl -fsS localhost:7070/healthz
          curl -fsS localhost:7070/api/catalog -o catalog.json
          jq -e '.public == true' catalog.json
          curl -fsSI localhost:7070/ | grep -i 'x-frame-options: DENY'

      - name: Export, build and run agent bundles
        run: |
          set -euo pipefail
          wait_healthy() {
            for i in $(seq 1 60); do
              s=$(docker inspect -f '{{.State.Health.Status}}' "$1")
              [ "$s" = healthy ] && return 0
              sleep 2
            done
            echo "::error::$1 is $s"; docker logs "$1"; return 1
          }
          # minimal preset -> distroless image; coding preset -> Debian image with tools
          port=8180
          for preset in minimal coding; do
            port=$((port + 1))
            spec=$(jq -c --arg p "$preset" '.presets[] | select(.id == $p) | .spec' catalog.json)
            name=$(jq -r '.name' <<<"$spec")
            echo "::group::$preset ($name)"
            curl -fsS -X POST localhost:7070/api/build -H 'Content-Type: application/json' \
              -d "{\"spec\":$spec,\"os\":\"linux\",\"arch\":\"amd64\",\"docker\":true}" -o "$name.zip"
            unzip -q -o "$name.zip"
            ls -la "$name" "$name/docker"/*
            docker build -t "$name:ci" "$name"
            docker run -d --name "$name" -p "$port:8080" "$name:ci"
            wait_healthy "$name"
            curl -fsS "localhost:$port/v1/models" | jq -e --arg n "$name" '.data[0].id == $n'
            # Secrets are never baked in: the spec only names env vars.
            # (An explicit if: a `!`-negated command never trips set -e.)
            if docker history --no-trunc "$name:ci" | grep -qi 'sk-'; then
              echo "::error::$name image history contains something that looks like an API key"; exit 1
            fi
            echo "::endgroup::"
          done

      - name: Container logs
        if: always()
        run: |
          for c in $(docker ps -aq); do echo "::group::$(docker inspect -f '{{.Name}}' $c)"; docker logs "$c" 2>&1 | tail -50; echo "::endgroup::"; done
