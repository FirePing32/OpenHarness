<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>OpenHarness Builder</title>
  <meta name="description" content="Customize every part of an AI agent's harness, then download one binary with an OpenAI-compatible API.">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="canonical" href="__BASE_URL__/">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Link previews: WhatsApp, Telegram, Facebook, LinkedIn, Slack, Discord, iMessage, Reddit (Open Graph)
       and X/Twitter (twitter:*). __BASE_URL__ is filled in by the server, because previews need absolute
       URLs and the domain isn't known at build time. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OpenHarness">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="OpenHarness: build your own AI agent">
  <meta property="og:description" content="Customize every part of an AI agent's harness, then download one binary with an OpenAI-compatible API.">
  <meta property="og:url" content="__BASE_URL__/">
  <meta property="og:image" content="__BASE_URL__/og.png">
  <meta property="og:image:secure_url" content="__BASE_URL__/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="OpenHarness: build your own AI agent">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OpenHarness: build your own AI agent">
  <meta name="twitter:description" content="Customize every part of an AI agent's harness, then download one binary with an OpenAI-compatible API.">
  <meta name="twitter:image" content="__BASE_URL__/og.png">
  <meta name="twitter:image:alt" content="OpenHarness: build your own AI agent">
  <script>
    // Apply a saved theme before first paint to avoid a flash of the wrong one.
    try { var t = localStorage.getItem('openharness.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="topbar">
    <div class="topbar-left">
      <button type="button" class="brand" id="brand" title="Back to start">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" />
          <path d="M9 9h4v14H9zM19 9h4v14h-4zM13 14h6v4h-6z" />
        </svg>
        <span class="brand-name">OpenHarness</span>
      </button>
      <span class="topbar-sep" aria-hidden="true">/</span>
      <span class="agent-name mono" id="agent-name"></span>
      <span class="status-pill" id="status-pill" hidden></span>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn btn-ghost btn-sm theme-toggle" id="btn-theme"></button>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-spec" aria-pressed="false">Spec JSON</button>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-import">Import</button>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-export">Export JSON</button>
      <button type="button" class="btn btn-ghost btn-sm btn-danger-text" id="btn-reset">Reset</button>
      <input type="file" id="input-import" accept="application/json,.json" hidden>
    </div>
  </header>
  <div id="app" tabindex="-1">
    <noscript><p class="noscript">OpenHarness Builder needs JavaScript enabled.</p></noscript>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
